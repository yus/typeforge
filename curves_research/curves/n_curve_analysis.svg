<?xml version="1.0" encoding="UTF-8"?>
<svg width="849.5999999999999" height="770.5999999999999" viewBox="0 0 849.5999999999999 770.5999999999999"
     xmlns="http://www.w3.org/2000/svg">
    
    <defs>
        <style>
            /* Base styles */
            .glyph-outline { fill: none; stroke: #333; stroke-width: 2; opacity: 0.7; }
            
            /* Grid styles */
            .grid-line { stroke: #e0e0ff; stroke-width: 0.5; opacity: 0.5; }
            .grid-line-major { stroke: #c0c0ff; stroke-width: 0.8; opacity: 0.7; }
            .grid-coord { font-family: Arial; font-size: 8px; fill: #666; opacity: 0.7; }
            
            /* Arc analysis styles */
            .circular-arc-guide { fill: none; stroke: #ff5500; stroke-width: 1.5; stroke-dasharray: 5,3; opacity: 0.8; }
            .arc-center { fill: #ff5500; stroke: none; r: 3; opacity: 0.9; }
            .radius-line { stroke: #ff5500; stroke-width: 1; stroke-dasharray: 2,2; opacity: 0.6; }
            .arc-label { font-family: Arial; font-size: 9px; fill: #ff5500; font-weight: bold; }
            
            /* Bezier segment styles */
            .bezier-segment { fill: none; stroke: #00aa00; stroke-width: 1.2; opacity: 0.8; }
            .control-point-on { fill: #ff0000; stroke: none; r: 2.5; }
            .control-point-off { fill: #0000ff; stroke: none; r: 2; }
            .control-line { stroke: #ff66aa; stroke-width: 0.8; stroke-dasharray: 2,2; opacity: 0.6; }
            
            /* Information styles */
            .info-box { fill: white; stroke: #ccc; stroke-width: 1; opacity: 0.9; }
            .info-text { font-family: Arial; font-size: 10px; fill: #333; }
            .info-title { font-family: Arial; font-size: 11px; fill: #333; font-weight: bold; }
            
            /* Legend styles */
            .legend-item { font-family: Arial; font-size: 9px; fill: #333; }
        </style>
        
        <!-- Arrow marker for angle indication -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
                refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#ff5500"/>
        </marker>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="white"/>
    
    <g transform="translate(159.29999999999998, 159.29999999999998)">
    
    <!-- OPTIMAL CONSTRUCTION GRID -->
    <g id="construction-grid">
        <line x1="-5" y1="0" x2="-5" y2="475" class="grid-line"/>
        <line x1="20" y1="0" x2="20" y2="475" class="grid-line-major"/>
        <text x="20" y="487" class="grid-coord" text-anchor="middle">20</text>
        <line x1="45" y1="0" x2="45" y2="475" class="grid-line"/>
        <line x1="70" y1="0" x2="70" y2="475" class="grid-line"/>
        <line x1="95" y1="0" x2="95" y2="475" class="grid-line"/>
        <line x1="120" y1="0" x2="120" y2="475" class="grid-line"/>
        <line x1="145" y1="0" x2="145" y2="475" class="grid-line-major"/>
        <text x="145" y="487" class="grid-coord" text-anchor="middle">145</text>
        <line x1="170" y1="0" x2="170" y2="475" class="grid-line"/>
        <line x1="195" y1="0" x2="195" y2="475" class="grid-line"/>
        <line x1="220" y1="0" x2="220" y2="475" class="grid-line"/>
        <line x1="245" y1="0" x2="245" y2="475" class="grid-line"/>
        <line x1="270" y1="0" x2="270" y2="475" class="grid-line-major"/>
        <text x="270" y="487" class="grid-coord" text-anchor="middle">270</text>
        <line x1="295" y1="0" x2="295" y2="475" class="grid-line"/>
        <line x1="320" y1="0" x2="320" y2="475" class="grid-line"/>
        <line x1="345" y1="0" x2="345" y2="475" class="grid-line"/>
        <line x1="370" y1="0" x2="370" y2="475" class="grid-line"/>
        <line x1="395" y1="0" x2="395" y2="475" class="grid-line-major"/>
        <text x="395" y="487" class="grid-coord" text-anchor="middle">395</text>
        <line x1="420" y1="0" x2="420" y2="475" class="grid-line"/>
        <line x1="445" y1="0" x2="445" y2="475" class="grid-line"/>
        <line x1="470" y1="0" x2="470" y2="475" class="grid-line"/>
        <line x1="495" y1="0" x2="495" y2="475" class="grid-line"/>
        <line x1="520" y1="0" x2="520" y2="475" class="grid-line-major"/>
        <text x="520" y="487" class="grid-coord" text-anchor="middle">520</text>
        <line x1="545" y1="0" x2="545" y2="475" class="grid-line"/>
        <line x1="-5" y1="0" x2="545" y2="0" class="grid-line-major"/>
        <text x="-13" y="3" class="grid-coord" text-anchor="end">0</text>
        <line x1="-5" y1="25" x2="545" y2="25" class="grid-line"/>
        <line x1="-5" y1="50" x2="545" y2="50" class="grid-line"/>
        <line x1="-5" y1="75" x2="545" y2="75" class="grid-line"/>
        <line x1="-5" y1="100" x2="545" y2="100" class="grid-line"/>
        <line x1="-5" y1="125" x2="545" y2="125" class="grid-line-major"/>
        <text x="-13" y="128" class="grid-coord" text-anchor="end">125</text>
        <line x1="-5" y1="150" x2="545" y2="150" class="grid-line"/>
        <line x1="-5" y1="175" x2="545" y2="175" class="grid-line"/>
        <line x1="-5" y1="200" x2="545" y2="200" class="grid-line"/>
        <line x1="-5" y1="225" x2="545" y2="225" class="grid-line"/>
        <line x1="-5" y1="250" x2="545" y2="250" class="grid-line-major"/>
        <text x="-13" y="253" class="grid-coord" text-anchor="end">250</text>
        <line x1="-5" y1="275" x2="545" y2="275" class="grid-line"/>
        <line x1="-5" y1="300" x2="545" y2="300" class="grid-line"/>
        <line x1="-5" y1="325" x2="545" y2="325" class="grid-line"/>
        <line x1="-5" y1="350" x2="545" y2="350" class="grid-line"/>
        <line x1="-5" y1="375" x2="545" y2="375" class="grid-line-major"/>
        <text x="-13" y="378" class="grid-coord" text-anchor="end">375</text>
        <line x1="-5" y1="400" x2="545" y2="400" class="grid-line"/>
        <line x1="-5" y1="425" x2="545" y2="425" class="grid-line"/>
        <line x1="-5" y1="450" x2="545" y2="450" class="grid-line"/>
        <line x1="-5" y1="475" x2="545" y2="475" class="grid-line"/>
    </g>
    
    <!-- GLYPH OUTLINE (faded background) -->
    <path d="M92 493q0 -37 -5 -48q-8 -17 -44 -43v-10l119 -44l11 4l-8 73q51 -37 85 -54q47 -23 91 -23q79 0 108 57q18 35 18 101v178q0 62 11.5 77.5t66.5 23.5v15h-233v-15q55 -8 66.5 -24t11.5 -77v-115q0 -80 -13 -110q-26 -59 -106 -59q-55 0 -102 43v241q0 62 11.5 77.5
t66.5 23.5v15h-233v-15q55 -8 66.5 -24t11.5 -77v-191z" class="glyph-outline"/>
    
    <!-- BEZIER SEGMENT ANALYSIS -->
    <g id="bezier-analysis">
    </g>
    
    <!-- CIRCULAR ARC ANALYSIS -->
    <g id="circular-arcs">
    </g>
    
    <!-- GRID ALIGNMENT MARKS -->
    <g id="grid-alignment">
        <!-- bbox-corner at (14,0) -->
        <line x1="8.0" y1="0.0" x2="20.0" y2="0.0" stroke="#ffaa00" stroke-width="1"/>
        <line x1="14.0" y1="-6.0" x2="14.0" y2="6.0" stroke="#ffaa00" stroke-width="1"/>
        <!-- bbox-corner at (545,0) -->
        <line x1="539.0" y1="0.0" x2="551.0" y2="0.0" stroke="#00aa00" stroke-width="1"/>
        <line x1="545.0" y1="-6.0" x2="545.0" y2="6.0" stroke="#00aa00" stroke-width="1"/>
        <!-- bbox-corner at (14,452) -->
        <line x1="8.0" y1="452.0" x2="20.0" y2="452.0" stroke="#ffaa00" stroke-width="1"/>
        <line x1="14.0" y1="446.0" x2="14.0" y2="458.0" stroke="#ffaa00" stroke-width="1"/>
        <!-- bbox-corner at (545,452) -->
        <line x1="539.0" y1="452.0" x2="551.0" y2="452.0" stroke="#00aa00" stroke-width="1"/>
        <line x1="545.0" y1="446.0" x2="545.0" y2="458.0" stroke="#00aa00" stroke-width="1"/>
    </g>
    
    </g> <!-- End of main transform group -->
    
    <!-- ANALYSIS SUMMARY BOX -->
    <g transform="translate(20, 30)">
        <rect width="280" height="160" class="info-box" rx="5"/>
        <text x="10" y="25" class="info-title">{glyph_name} Curve Analysis</text>
        
        <text x="15" y="45" class="info-text">Total Bezier segments: {len(segments)}</text>
        <text x="15" y="60" class="info-text">Circular arcs detected: {len([a for a in arcs if a.get("is_circular_arc", False)])}</text>
        <text x="15" y="75" class="info-text">Optimal grid: {optimal_grid["grid_x"]}×{optimal_grid["grid_y"]} units</text>
        <text x="15" y="90" class="info-text">Grid offset: ({optimal_grid["offset_x"]},{optimal_grid["offset_y"]})</text>
        <text x="15" y="105" class="info-text">Grid alignment: {optimal_grid["score"]}/{optimal_grid["max_possible"]} points</text>
        <text x="15" y="120" class="info-text">Bounding box: [{left:.0f}, {bottom:.0f}, {right:.0f}, {top:.0f}]</text>
        <text x="15" y="135" class="info-text">Dimensions: {width:.0f} × {height:.0f} units</text>
        
        <!-- Common radii -->
    </g>
    
    <!-- LEGEND -->
    <g transform="translate({svg_width - 180}, 30)">
        <rect width="160" height="150" class="info-box" rx="5"/>
        <text x="10" y="25" class="info-title">Legend</text>
        
        <line x1="15" x2="25" y1="40" y2="40" stroke="#e0e0ff" stroke-width="1"/>
        <text x="30" y="43" class="legend-item">Construction grid</text>
        
        <line x1="15" x2="25" y1="55" y2="55" stroke="#ff5500" stroke-dasharray="5,3" stroke-width="1.5"/>
        <text x="30" y="58" class="legend-item">Circular arc guide</text>
        
        <circle cx="20" cy="70" r="3" fill="#ff5500"/>
        <text x="30" y="73" class="legend-item">Arc center</text>
        
        <line x1="15" x2="25" y1="85" y2="85" stroke="#00aa00" stroke-width="1.2"/>
        <text x="30" y="88" class="legend-item">Bezier segment</text>
        
        <circle cx="20" cy="100" r="2.5" fill="#ff0000"/>
        <text x="30" y="103" class="legend-item">On-curve point</text>
        
        <circle cx="20" cy="115" r="2" fill="#0000ff"/>
        <text x="30" y="118" class="legend-item">Off-curve point</text>
        
        <line x1="15" x2="25" y1="130" y2="130" stroke="#00aa00" stroke-width="1"/>
        <text x="30" y="133" class="legend-item">Grid alignment</text>
    </g>
    
    <!-- TITLE -->
    <text x="{svg_width/2}" y="20" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">
        Mathematical Curve Analysis: {glyph_name}
    </text>
    
</svg>