<?xml version="1.0" encoding="UTF-8"?>
<svg width="1076.4" height="1126.4" viewBox="0 0 1076.4 1126.4"
     xmlns="http://www.w3.org/2000/svg">
    
    <defs>
        <style>
            /* Base styles */
            .glyph-outline { fill: none; stroke: #333; stroke-width: 2; opacity: 0.7; }
            
            /* Grid styles */
            .grid-line { stroke: #e0e0ff; stroke-width: 0.5; opacity: 0.5; }
            .grid-line-major { stroke: #c0c0ff; stroke-width: 0.8; opacity: 0.7; }
            .grid-coord { font-family: Arial; font-size: 8px; fill: #666; opacity: 0.7; }
            
            /* Arc analysis styles */
            .circular-arc-guide { fill: none; stroke: #ff5500; stroke-width: 1.5; stroke-dasharray: 5,3; opacity: 0.8; }
            .arc-center { fill: #ff5500; stroke: none; r: 3; opacity: 0.9; }
            .radius-line { stroke: #ff5500; stroke-width: 1; stroke-dasharray: 2,2; opacity: 0.6; }
            .arc-label { font-family: Arial; font-size: 9px; fill: #ff5500; font-weight: bold; }
            
            /* Bezier segment styles */
            .bezier-segment { fill: none; stroke: #00aa00; stroke-width: 1.2; opacity: 0.8; }
            .control-point-on { fill: #ff0000; stroke: none; r: 2.5; }
            .control-point-off { fill: #0000ff; stroke: none; r: 2; }
            .control-line { stroke: #ff66aa; stroke-width: 0.8; stroke-dasharray: 2,2; opacity: 0.6; }
            
            /* Information styles */
            .info-box { fill: white; stroke: #ccc; stroke-width: 1; opacity: 0.9; }
            .info-text { font-family: Arial; font-size: 10px; fill: #333; }
            .info-title { font-family: Arial; font-size: 11px; fill: #333; font-weight: bold; }
            
            /* Legend styles */
            .legend-item { font-family: Arial; font-size: 9px; fill: #333; }
        </style>
        
        <!-- Arrow marker for angle indication -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
                refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#ff5500"/>
        </marker>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="white"/>
    
    <g transform="translate(211.2, 211.2)">
    
    <!-- OPTIMAL CONSTRUCTION GRID -->
    <g id="construction-grid">
        <line x1="30" y1="-35" x2="30" y2="715" class="grid-line"/>
        <line x1="55" y1="-35" x2="55" y2="715" class="grid-line"/>
        <line x1="80" y1="-35" x2="80" y2="715" class="grid-line"/>
        <line x1="105" y1="-35" x2="105" y2="715" class="grid-line"/>
        <line x1="130" y1="-35" x2="130" y2="715" class="grid-line-major"/>
        <text x="130" y="727" class="grid-coord" text-anchor="middle">130</text>
        <line x1="155" y1="-35" x2="155" y2="715" class="grid-line"/>
        <line x1="180" y1="-35" x2="180" y2="715" class="grid-line"/>
        <line x1="205" y1="-35" x2="205" y2="715" class="grid-line"/>
        <line x1="230" y1="-35" x2="230" y2="715" class="grid-line"/>
        <line x1="255" y1="-35" x2="255" y2="715" class="grid-line-major"/>
        <text x="255" y="727" class="grid-coord" text-anchor="middle">255</text>
        <line x1="280" y1="-35" x2="280" y2="715" class="grid-line"/>
        <line x1="305" y1="-35" x2="305" y2="715" class="grid-line"/>
        <line x1="330" y1="-35" x2="330" y2="715" class="grid-line"/>
        <line x1="355" y1="-35" x2="355" y2="715" class="grid-line"/>
        <line x1="380" y1="-35" x2="380" y2="715" class="grid-line-major"/>
        <text x="380" y="727" class="grid-coord" text-anchor="middle">380</text>
        <line x1="405" y1="-35" x2="405" y2="715" class="grid-line"/>
        <line x1="430" y1="-35" x2="430" y2="715" class="grid-line"/>
        <line x1="455" y1="-35" x2="455" y2="715" class="grid-line"/>
        <line x1="480" y1="-35" x2="480" y2="715" class="grid-line"/>
        <line x1="505" y1="-35" x2="505" y2="715" class="grid-line-major"/>
        <text x="505" y="727" class="grid-coord" text-anchor="middle">505</text>
        <line x1="530" y1="-35" x2="530" y2="715" class="grid-line"/>
        <line x1="555" y1="-35" x2="555" y2="715" class="grid-line"/>
        <line x1="580" y1="-35" x2="580" y2="715" class="grid-line"/>
        <line x1="605" y1="-35" x2="605" y2="715" class="grid-line"/>
        <line x1="630" y1="-35" x2="630" y2="715" class="grid-line-major"/>
        <text x="630" y="727" class="grid-coord" text-anchor="middle">630</text>
        <line x1="655" y1="-35" x2="655" y2="715" class="grid-line"/>
        <line x1="680" y1="-35" x2="680" y2="715" class="grid-line"/>
        <line x1="705" y1="-35" x2="705" y2="715" class="grid-line"/>
        <line x1="730" y1="-35" x2="730" y2="715" class="grid-line"/>
        <line x1="30" y1="-35" x2="730" y2="-35" class="grid-line"/>
        <line x1="30" y1="-10" x2="730" y2="-10" class="grid-line"/>
        <line x1="30" y1="15" x2="730" y2="15" class="grid-line-major"/>
        <text x="22" y="18" class="grid-coord" text-anchor="end">15</text>
        <line x1="30" y1="40" x2="730" y2="40" class="grid-line"/>
        <line x1="30" y1="65" x2="730" y2="65" class="grid-line"/>
        <line x1="30" y1="90" x2="730" y2="90" class="grid-line"/>
        <line x1="30" y1="115" x2="730" y2="115" class="grid-line"/>
        <line x1="30" y1="140" x2="730" y2="140" class="grid-line-major"/>
        <text x="22" y="143" class="grid-coord" text-anchor="end">140</text>
        <line x1="30" y1="165" x2="730" y2="165" class="grid-line"/>
        <line x1="30" y1="190" x2="730" y2="190" class="grid-line"/>
        <line x1="30" y1="215" x2="730" y2="215" class="grid-line"/>
